spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.expensio.backend: DEBUG
    org.springframework.security: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:dev_secret_key_needs_to_be_at_least_256_bits_for_hmac_sha256_local_only!}
    issuer: expensio-api-dev
