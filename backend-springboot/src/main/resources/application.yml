server:
  port: ${SERVER_PORT:5001}
  servlet:
    context-path: /

spring:
  application:
    name: expensio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres.cgsensrlcauiljsiyslk}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    defaults:
      enabled: true
    db:
      enabled: ${DB_HEALTH_ENABLED:false}

# Application-specific environment configuration
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000} # 24 hours
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 days
    issuer: ${JWT_ISSUER:expensio-api}
  google:
    client-id: ${GOOGLE_CLIENT_ID:895048152817-bd0o5nuuf888gbms8tvigavc9rqouk2g.apps.googleusercontent.com}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    phone-number: ${TWILIO_PHONE_NUMBER:}
  friends:
    friend-cap: ${FRIENDS_CAP:10}
    guest-cap: ${FRIENDS_GUEST_CAP:5}
    guests-count-toward-friend-cap: ${FRIENDS_GUESTS_COUNT_TOWARD_CAP:true}
    split-obligation-stub-decision: ${FRIENDS_SPLIT_OBLIGATION_STUB_DECISION:UNKNOWN}
    search:
      min-query-length: 2
      max-query-length: 50
      default-limit: 50
      max-limit: 100
    avatar-allowlist:
      - avatar_1
      - avatar_2
      - avatar_3
      - avatar_4
      - avatar_5
      - avatar_6
      - avatar_7
      - avatar_8
      - avatar_9
      - avatar_10
      - avatar_11
      - avatar_12
