server:
  port: 0

spring:
  application:
    name: expensio-backend-test
  profiles:
    active: test
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.orm.jpa.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: test_jwt_secret_key_minimum_256_bits_length_for_hmac_sha256_tests!
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 86400000
    issuer: expensio-api-test
  google:
    client-id: test-google-client-id
  mail:
    host: localhost
    port: 25
    username: test
    password: test
